# @package _global_

workflow_cls: evorl.algorithms.erl.erl_td3.erl_utility_replay.ERLUtilityReplayWorkflow

arm: uniform
arm_manifest_path: null
score_kind: uniform
alpha: 0
diagnostic_enabled: false
diagnostic_interval: 10
enable_eval_loss_endpoint: false
source_batch_size: 256
freshness_window: 30
min_resident: 4
replay_temperature: 0.5

temporal_mode: original
recent_generations: 5
history_generations: 25

num_envs: 1
normalize_obs: false
discount: 0.99
total_episodes: 3290

random_timesteps: 0
replay_buffer_capacity: 1000000

tau: 0.005
exploration_epsilon: 0.1
policy_noise: 0.2
clip_policy_noise: 0.5
actor_update_interval: 2
critics_in_actor_loss: first

num_rl_agents: 1
warmup_iters: 10
rl_updates_mode: iter
rl_updates_frac: 1.0

episodes_for_fitness: 1
rollout_episodes: 1
fitness_with_exploration: false
rl_exploration: true
batch_size: 256

optimizer:
  lr: 0.0003
  grad_clip_norm: 0

rl_injection_interval: 10
pop_size: 32
num_elites: 4
tournament_size: 3
weight_max_magnitude: 1000000.0
mut_strength: 0.1
num_mutation_frac: 0.1
super_mut_strength: 10.0
super_mut_prob: 0.05
reset_prob: 0.05
vec_relative_prob: 0.0
enable_crossover: false
num_crossover_frac: 0.1

agent_network:
  norm_layer_type: layer_norm
  num_critics: 2
  critic_hidden_layer_sizes: [256, 256]
  actor_hidden_layer_sizes: [256, 256]

num_eval_envs: 128
eval_episodes: 128
eval_interval: 10
save_replay_buffer: true
